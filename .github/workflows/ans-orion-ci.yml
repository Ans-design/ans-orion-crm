# CI bloquant V10 — secrets jamais loggés
name: ans-orion-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      APP_ENV: local
      NEXTAUTH_SECRET: ci-test-secret-min-32-characters-xx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Secrets scan (names only)
        run: |
          if git ls-files | grep -E '(^|/)\.env(?!\.example)' ; then
            echo "Forbidden .env tracked"; exit 1;
          fi
          if git ls-files | grep -E '\.(db|sqlite)$' ; then
            echo "Forbidden db tracked"; exit 1;
          fi
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=dot
      - run: npm run audit:api-auth
      - name: Build
        run: npm run build
